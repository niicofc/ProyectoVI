<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 190" width="760" height="190" font-family="'Archivo Black','Arial Black',sans-serif">
  <defs>
    <linearGradient id="mag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff2d78"/><stop offset="1" stop-color="#d6155c"/>
    </linearGradient>
    <radialGradient id="ball" cx="38%" cy="32%" r="70%">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e8e9f2"/>
    </radialGradient>
  </defs>
  <!-- Badge -->
  <rect x="20" y="24" width="150" height="150" rx="26" fill="#1b1b3a"/>
  <rect x="12" y="14" width="150" height="150" rx="26" fill="url(#mag)" stroke="#1b1b3a" stroke-width="7"/>
  <!-- glitch bars -->
  <rect x="30" y="32" width="48" height="9" rx="4" fill="#06d6a0"/>
  <rect x="96" y="138" width="40" height="9" rx="4" fill="#ffd23f"/>
  <!-- flame -->
  <text x="112" y="52" font-size="34" text-anchor="middle">🔥</text>
  <!-- P F with ball -->
  <g transform="skewX(-8)">
    <text x="34" y="128" font-size="86" fill="#1b1b3a" stroke="#1b1b3a" stroke-width="11" stroke-linejoin="round">P</text>
    <text x="34" y="128" font-size="86" fill="#fff">P</text>
    <text x="112" y="128" font-size="86" fill="#1b1b3a" stroke="#1b1b3a" stroke-width="11" stroke-linejoin="round">F</text>
    <text x="112" y="128" font-size="86" fill="#fff">F</text>
  </g>
  <!-- ball as connector -->
  <circle cx="93" cy="98" r="21" fill="url(#ball)" stroke="#1b1b3a" stroke-width="5"/>
  <path d="M93 86 l9 7 -3 11 h-12 l-3 -11 z" fill="#1b1b3a"/>
  <!-- Wordmark -->
  <text x="205" y="115" font-size="62" letter-spacing="-1" fill="#1b1b3a">Passion<tspan fill="#d6155c">Fut</tspan></text>
</svg>
