<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 220" width="520" height="220" font-family="'Archivo Black','Arial Black',sans-serif">
  <defs>
    <linearGradient id="mag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff2d78"/>
      <stop offset="1" stop-color="#d6155c"/>
    </linearGradient>
  </defs>
  <!-- offset hard shadow -->
  <rect x="24" y="26" width="472" height="168" rx="26" fill="#1b1b3a"/>
  <!-- badge -->
  <rect x="14" y="14" width="472" height="168" rx="26" fill="url(#mag)" stroke="#1b1b3a" stroke-width="7"/>
  <!-- glitch accent bars -->
  <rect x="34" y="40" width="80" height="10" rx="5" fill="#06d6a0" opacity=".9"/>
  <rect x="34" y="150" width="120" height="10" rx="5" fill="#ffd23f" opacity=".9"/>
  <!-- PF text: black outline + white fill, italic skew -->
  <g transform="skewX(-8)">
    <text x="150" y="140" font-size="132" fill="#1b1b3a" stroke="#1b1b3a" stroke-width="16" stroke-linejoin="round">PF</text>
    <text x="150" y="140" font-size="132" fill="#ffffff">PF</text>
  </g>
</svg>
